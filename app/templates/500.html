{% extends "base.html" %}

{% block title %}Ошибка сервера - {{ site_name }}{% endblock %}

{% block content %}
<section class="error-section" style="min-height: 60vh; display: flex; align-items: center; background: linear-gradient(135deg, #FF6B6B 0%, #C92A2A 100%); color: white;">
    <div class="container text-center">
        <h1 class="display-1 fw-bold mb-4">500</h1>
        <h2 class="display-5 mb-4">Ошибка сервера</h2>
        <p class="lead mb-4">Ой! Что-то пошло не так с нашей стороны. Мы работаем над исправлением.</p>
        
        <div class="btn-group-custom">
            <a href="/" class="btn btn-light btn-lg me-2">
                <i class="fas fa-home"></i> На главную
            </a>
            <a href="/contact" class="btn btn-outline-light btn-lg">
                <i class="fas fa-envelope"></i> Поддержка контактов
            </a>
        </div>

        <div class="mt-5 pt-5">
            <i class="fas fa-exclamation-triangle fa-5x" style="opacity: 0.3;"></i>
        </div>
    </div>
</section>
{% endblock %}
