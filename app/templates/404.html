{% extends "base.html" %}

{% block title %}Страница не найдена - {{ site_name }}{% endblock %}

{% block content %}
<section class="error-section" style="min-height: 60vh; display: flex; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
    <div class="container text-center">
        <h1 class="display-1 fw-bold mb-4">404</h1>
        <h2 class="display-5 mb-4">Страница не найдена</h2>
        <p class="lead mb-4">Извините, страница, которую вы ищете, не существует или была перемещена.</p>
        
        <div class="btn-group-custom">
            <a href="/" class="btn btn-light btn-lg me-2">
                <i class="fas fa-home"></i> На главную
            </a>
            <a href="/services" class="btn btn-outline-light btn-lg">
                <i class="fas fa-spa"></i> Просмотр услуг
            </a>
        </div>

        <div class="mt-5 pt-5">
            <i class="fas fa-search fa-5x" style="opacity: 0.3;"></i>
        </div>
    </div>
</section>
{% endblock %}
